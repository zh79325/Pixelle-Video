<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="1024">
    <meta name="template:media-height" content="1024">
    <style>
        html {
            margin: 0;
            padding: 0;
        }
        
        body {
            margin: 0;
            padding: 0;
            width: 1080px;
            height: 1920px;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            font-family: 'PingFang SC', 'Source Han Sans', 'Microsoft YaHei', sans-serif;
            position: relative;
            overflow: hidden;
        }
        
        .page-container {
            width: 1080px;
            height: 1920px;
            padding: 60px 50px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        
        /* Background pattern */
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.05;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
        }
        
        /* Chapter title */
        .chapter-title {
            font-size: 44px;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
        }
        
        /* Character portrait area */
        .portrait-area {
            width: 100%;
            max-width: 800px;
            margin: 30px 0;
            position: relative;
        }
        
        .portrait-frame {
            width: 100%;
            height: 700px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
            border: 4px solid rgba(255, 255, 255, 0.15);
            position: relative;
        }
        
        .portrait-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.9) contrast(1.1);
        }
        
        /* Portrait overlay gradient */
        .portrait-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, transparent 100%);
        }
        
        /* Character name on portrait */
        .character-name-overlay {
            position: absolute;
            bottom: 30px;
            left: 30px;
            font-size: 36px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }
        
        /* Monologue section */
        .monologue-section {
            flex: 1;
            width: 100%;
            max-width: 850px;
            margin: 30px 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .monologue-quote {
            position: relative;
            padding: 30px 40px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border-left: 5px solid #667eea;
        }
        
        .quote-mark {
            position: absolute;
            top: -15px;
            left: 20px;
            font-size: 80px;
            color: rgba(102, 126, 234, 0.3);
            font-family: Georgia, serif;
            line-height: 1;
        }
        
        .monologue-text {
            font-size: 36px;
            color: #ffffff;
            line-height: 1.8;
            text-align: left;
            font-style: italic;
            position: relative;
            z-index: 1;
        }
        
        /* Scene info */
        .scene-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 850px;
            padding: 20px 0;
            margin-top: 20px;
            border-top: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .scene-number {
            font-size: 26px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
        }
        
        .emotion-tag {
            padding: 10px 25px;
            background: rgba(102, 126, 234, 0.3);
            border-radius: 20px;
            font-size: 24px;
            color: #ffffff;
            border: 1px solid rgba(102, 126, 234, 0.5);
        }
        
    </style>
</head>
<body>
    <!-- Background pattern -->
    <div class="bg-pattern"></div>
    
    <div class="page-container">
        <!-- Chapter title -->
        <div class="chapter-title">{{title}}</div>
        
        <!-- Character portrait area -->
        <div class="portrait-area">
            <div class="portrait-frame">
                <img src="{{image}}" alt="Character Portrait">
                <div class="portrait-overlay"></div>
                <div class="character-name-overlay">{{character_name}}</div>
            </div>
        </div>
        
        <!-- Monologue section -->
        <div class="monologue-section">
            <div class="monologue-quote">
                <div class="quote-mark">"</div>
                <div class="monologue-text">{{text}}</div>
            </div>
        </div>
        
        <!-- Scene info -->
        <div class="scene-info">
            <div class="scene-number">场景 {{scene_id}}</div>
            {{#emotion}}
            <div class="emotion-tag">{{emotion}}</div>
            {{/emotion}}
        </div>
    </div>
</body>
</html>
