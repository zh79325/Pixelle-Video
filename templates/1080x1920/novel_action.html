<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="1024">
    <meta name="template:media-height" content="1024">
    <style>
        html {
            margin: 0;
            padding: 0;
        }
        
        body {
            margin: 0;
            padding: 0;
            width: 1080px;
            height: 1920px;
            background: linear-gradient(180deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            font-family: 'PingFang SC', 'Source Han Sans', 'Microsoft YaHei', sans-serif;
            position: relative;
            overflow: hidden;
        }
        
        .page-container {
            width: 1080px;
            height: 1920px;
            padding: 60px 50px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }
        
        /* Background effects */
        .bg-effects {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        
        .energy-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); opacity: 0.6; }
            50% { transform: translateY(-20px); opacity: 1; }
        }
        
        .particle-1 { top: 20%; left: 15%; animation-delay: 0s; }
        .particle-2 { top: 40%; right: 20%; animation-delay: 0.5s; }
        .particle-3 { top: 60%; left: 25%; animation-delay: 1s; }
        .particle-4 { top: 75%; right: 15%; animation-delay: 1.5s; }
        
        /* Scene header */
        .scene-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .scene-number-badge {
            display: inline-block;
            padding: 10px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 25px;
            font-size: 28px;
            font-weight: 700;
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .chapter-title {
            font-size: 42px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }
        
        /* Main image area */
        .image-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px 0;
            position: relative;
        }
        
        .image-frame {
            width: 100%;
            max-width: 900px;
            height: 900px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }
        
        .image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Action overlay */
        .action-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
        }
        
        .action-text {
            font-size: 36px;
            color: #ffffff;
            line-height: 1.6;
            text-align: center;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }
        
        /* Scene description */
        .scene-description {
            font-size: 32px;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            line-height: 1.7;
            padding: 25px 30px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            margin-top: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Emotion badge */
        .emotion-badge {
            position: absolute;
            top: 30px;
            right: 40px;
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* Character tags */
        .character-tags {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .character-tag {
            padding: 8px 20px;
            background: rgba(102, 126, 234, 0.3);
            border-radius: 15px;
            font-size: 24px;
            color: #ffffff;
            border: 1px solid rgba(102, 126, 234, 0.5);
        }
        
    </style>
</head>
<body>
    <!-- Background effects -->
    <div class="bg-effects">
        <div class="energy-particle particle-1"></div>
        <div class="energy-particle particle-2"></div>
        <div class="energy-particle particle-3"></div>
        <div class="energy-particle particle-4"></div>
    </div>
    
    <div class="page-container">
        <!-- Emotion badge -->
        {{#emotion}}
        <div class="emotion-badge">{{emotion}}</div>
        {{/emotion}}
        
        <!-- Scene header -->
        <div class="scene-header">
            <div class="scene-number-badge">场景 {{scene_id}}</div>
            <div class="chapter-title">{{title}}</div>
        </div>
        
        <!-- Main image area -->
        <div class="image-area">
            <div class="image-frame">
                <img src="{{image}}" alt="Action Scene">
                <div class="action-overlay">
                    <div class="action-text">{{scene_description}}</div>
                </div>
            </div>
        </div>
        
        <!-- Scene description -->
        <div class="scene-description">{{text}}</div>
        
        <!-- Character tags -->
        <div class="character-tags">
            {{#characters}}
            <div class="character-tag">{{.}}</div>
            {{/characters}}
        </div>
    </div>
</body>
</html>
